name: Deploy Worker to Cloud Run

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ contains(github.ref_name, 'main') && 'p-brecha-251-219-11-cd-493618' || 'd-brecha-251-219-11-CD' }}
  SERVICE_NAME: ${{ contains(github.ref_name, 'main') && 'brecha-ai-worker-prod' || 'brecha-ai-worker-dev' }}
  REGION: us-central1
  REPOSITORY: cloud-run-repo
  GCP_SA_EMAIL: ${{ contains(github.ref_name, 'main') && 'github-ci-service@p-brecha-251-219-11-cd-493618.iam.gserviceaccount.com' || 'github-ci-service@d-brecha-251-219-11-CD.iam.gserviceaccount.com' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI and Docker
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker --quiet ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Tag Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/brecha-ai-worker:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/brecha-ai-worker:latest"
          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .

      - name: Push Docker Image to Artifact Registry
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/brecha-ai-worker:${{ github.sha }}"
          docker push $IMAGE_TAG
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/brecha-ai-worker:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/brecha-ai-worker:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}
          flags: |
            --service-account=${{ env.GCP_SA_EMAIL }}
            --no-allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=1
            --max-instances=1
            --timeout=3600
            --concurrency=1
            --set-env-vars=ENVIRONMENT=${{ contains(github.ref_name, 'main') && 'production' || 'development' }},LOG_LEVEL=${{ contains(github.ref_name, 'main') && 'INFO' || 'DEBUG' }},GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_LOCATION=global,PUBSUB_SUBSCRIPTION_ID=brecha-worker-sub,PUBSUB_CATALOG_REFRESH_SUBSCRIPTION_ID=brecha-catalog-refresh-sub,GEMINI_MODEL_NAME=gemini-3.1-pro-preview
            --set-secrets=SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest
